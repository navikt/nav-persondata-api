name: Kodekvalitet

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  ktlint:
    name: Kotlin linting (ktlint)
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v7

      - name: Sett opp Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gjør Gradle kjørbar
        run: chmod +x ./gradlew

      - name: Kjør ktlint
        run: ./gradlew spotlessCheck

  detekt:
    name: Statisk analyse (Detekt)
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v6

      - name: Sett opp Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gjør Gradle kjørbar
        run: chmod +x ./gradlew

      # detektMain/detektTest (med type-resolution) brukes fremfor plain
      # "detekt" — flere regler (bl.a. UnsafeCallOnNullableType for !!-bruk)
      # krever type-resolution for å faktisk fungere.
      - name: Kjør Detekt
        run: ./gradlew detektMain detektTest

      - name: Last opp Detekt-rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt/
          retention-days: 14

  bygg:
    name: Bygg prosjekt
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v7

      - name: Sett opp Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gjør Gradle kjørbar
        run: chmod +x ./gradlew

      - name: Kjør bygg
        run: ./gradlew build

      - name: Last opp genererte GraphQL-kilder
        uses: actions/upload-artifact@v4
        with:
          name: generated-sources
          path: build/generated/
          retention-days: 1

  sonarcloud:
    name: SonarCloud analyse
    runs-on: ubuntu-latest
    needs: bygg
    continue-on-error: true

    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sett opp Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Last ned genererte GraphQL-kilder
        uses: actions/download-artifact@v4
        with:
          name: generated-sources
          path: build/generated/

      - name: Gjør Gradle kjørbar
        run: chmod +x ./gradlew

      - name: Kjør SonarCloud analyse
        run: ./gradlew test jacocoTestReport sonar -x graphqlGenerateNomClient -x graphqlGeneratePdlClient
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
